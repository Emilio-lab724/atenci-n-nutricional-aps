<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Emilio Alejandro Espinoza Sotomayor">

<meta charset="utf-8">
<title>Atención Nutricional APS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: herramienta de box clínico — barra superior con aviso, navegación por módulos a la izquierda,
   formulario al centro, panel de resultados clave a la derecha. Neutros con sesgo petróleo, un acento. */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --surface-2: #eaf0ef; --line: #d3dddb; --line-strong: #b7c6c3;
  --fg: #182423; --muted: #586b68; --accent: #0d5a5e; --accent-fg: #ffffff; --accent-soft: #dcebea;
  --ok: #23704a; --ok-bg: #e2f2e8; --warn: #9a5a00; --warn-bg: #fdefd7; --bad: #a8261e; --bad-bg: #fbe2df;
  --focus: #1b7f85;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1615; --surface: #162120; --surface-2: #1c2a29; --line: #2b3b39; --line-strong: #3d524f;
  --fg: #e1ebe9; --muted: #98aba8; --accent: #62b4b6; --accent-fg: #0b1615; --accent-soft: #1b3333;
  --ok: #7cc89c; --ok-bg: #16301f; --warn: #e8b25c; --warn-bg: #36280f; --bad: #f08b80; --bad-bg: #3b1916;
  --focus: #7fd0d2; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1615; --surface: #162120; --surface-2: #1c2a29; --line: #2b3b39; --line-strong: #3d524f;
  --fg: #e1ebe9; --muted: #98aba8; --accent: #62b4b6; --accent-fg: #0b1615; --accent-soft: #1b3333;
  --ok: #7cc89c; --ok-bg: #16301f; --warn: #e8b25c; --warn-bg: #36280f; --bad: #f08b80; --bad-bg: #3b1916;
  --focus: #7fd0d2; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.marca { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.marca b { font-size: 16px; font-weight: 600; letter-spacing: .01em; }
.marca span { color: var(--muted); font-size: 13px; }
.top-esp { flex: 1; }
.guardado { font-size: 12.5px; color: var(--muted); }
.aviso { background: var(--accent-soft); color: var(--fg); font-size: 12.5px; padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); }
.aviso strong { font-weight: 600; }

.wrap { padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1440px; margin: 0 auto; }

/* botones */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); padding: 7px 12px; border-radius: var(--r); cursor: pointer; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.peq { padding: 4px 9px; font-size: 13px; }
.btn.peligro { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* lista de pacientes */
.inicio-h { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
.inicio-h h1 { font-size: 22px; font-weight: 600; }
.inicio-h p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.caja { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.tabla-w { overflow-x: auto; }
table.pac { width: 100%; border-collapse: collapse; font-size: 14px; }
table.pac th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 10px 12px; border-bottom: 1px solid var(--line); }
table.pac td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.pac tr:last-child td { border-bottom: 0; }
table.pac tr.fila:hover td { background: var(--surface-2); }
.vacio { padding: 28px 18px; color: var(--muted); }
.vacio h2 { font-size: 16px; color: var(--fg); margin-bottom: 6px; font-weight: 600; }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.cargar-caso { display: flex; gap: 6px; align-items: center; }
.cargar-caso select { padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); }
.nota-pie { margin-top: 12px; color: var(--muted); font-size: 13px; }

/* ficha */
.ficha-h { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
.ficha-h h1 { font-size: 20px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.ficha-h .ctrl { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.ficha-h select { padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); }
.grid { display: grid; grid-template-columns: 220px minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
nav.mods { position: sticky; top: calc(var(--top-h, 100px) + var(--reloj-h, 0px) + 8px); display: flex; flex-direction: column; gap: 1px; }
nav.mods .grupo { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 12px 10px 4px; }
nav.mods button { text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: var(--r); cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
nav.mods button:hover:not([disabled]) { background: var(--surface-2); }
nav.mods button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav.mods button[disabled] { color: var(--muted); opacity: .7; cursor: default; }
nav.mods button small { font-size: 11px; font-weight: 400; color: var(--muted); white-space: nowrap; }

main.modulo { min-width: 0; }
.mod-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.mod-h h2 { font-size: 18px; font-weight: 600; }
.info { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted); cursor: pointer; font: 600 12px/1 var(--mono); display: inline-grid; place-items: center; flex: none; }
.info:hover { color: var(--accent); border-color: var(--accent); }
.fuente { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 8px 10px; margin: -4px 0 12px; }

section.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; }
section.sec > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 12px 16px 0; }
.sec-nota { font-size: 13px; color: var(--muted); padding: 4px 16px 0; }
.campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px 18px; padding: 14px 16px 16px; }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo.ancho { grid-column: 1 / -1; }
.campo label, .campo .lbl { font-size: 13.5px; color: var(--fg); }
.campo .tag { font-size: 11px; color: var(--muted); }
.campo input[type=text], .campo input[type=number], .campo input[type=date], .campo select, .campo textarea {
  width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); min-width: 0; }
.campo input:hover, .campo select:hover { border-color: var(--muted); }
.campo .err { color: var(--bad); font-size: 12.5px; }
.campo.invalido input { border-color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; align-self: flex-start; }
.seg label { position: relative; padding: 6px 14px; cursor: pointer; font-size: 14px; border-left: 1px solid var(--line-strong); }
.seg label:first-child { border-left: 0; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-fg); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: -2px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13.5px; cursor: pointer; }
.checks label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

/* resultados calculados */
.calc { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 6px 16px; padding: 14px 16px 4px; font-size: 14px; }
.calc dt { color: var(--muted); }
.calc dd { margin: 0; }
.estado { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 13.5px; }
.estado.normal { background: var(--ok-bg); color: var(--ok); }
.estado.riesgo { background: var(--warn-bg); color: var(--warn); }
.estado.alterado { background: var(--bad-bg); color: var(--bad); }
.verif { font-size: 12px; color: var(--warn); cursor: help; border-bottom: 1px dotted var(--warn); white-space: nowrap; background: none; border-top: 0; border-left: 0; border-right: 0; padding: 0; }
.verif-txt { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

.alertas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.alertas li { padding: 7px 10px; border-radius: var(--r); background: var(--warn-bg); color: var(--fg); font-size: 14px; border-left: 3px solid var(--warn); }
.alertas-box { padding: 14px 16px 16px; }
.callout { margin: 0 16px 14px; padding: 10px 12px; border-radius: var(--r); background: var(--accent-soft); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-size: 14px; }

/* actividad física, fármacos, recordatorio */
.ayuda { font-size: 12.5px; color: var(--muted); }
.niveles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.nivel { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-size: 13.5px; background: var(--surface); }
.nivel.sel { border-color: var(--accent); background: var(--accent-soft); }
.nivel b { display: block; font-weight: 600; }
.nivel .meta { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.meds { display: flex; flex-direction: column; gap: 8px; }
.med { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .8fr) minmax(0, 1.6fr) auto; gap: 8px; align-items: start; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); }
.med input { width: 100%; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); min-width: 0; }
.med .func-auto { border-color: var(--accent); }
.med small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.recordatorio { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; margin-bottom: 14px; border-radius: var(--r); background: var(--warn-bg); border: 1px solid var(--line); font-size: 14px; }
.recordatorio b { font-weight: 600; }
@media (max-width: 760px) { .med { grid-template-columns: minmax(0, 1fr); } }

/* resultados y curvas */
table.res td { font-variant-numeric: tabular-nums; }
.chart-box { padding: 4px 16px 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
.tabs button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.grafico { overflow-x: auto; }
.grafico svg { width: 100%; min-width: 520px; height: auto; display: block; }
.grafico .gb { stroke: none; }
.grafico .gok { fill: var(--ok-bg); } .grafico .gwarn { fill: var(--warn-bg); } .grafico .gbad { fill: var(--bad-bg); }
.grafico .gg { stroke: var(--line); stroke-width: 1; }
.grafico .gl { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: .8; }
.grafico .g0 { stroke: var(--ok); stroke-width: 2; opacity: 1; }
.grafico .glow { stroke: var(--bad); stroke-width: 2; stroke-dasharray: 5 4; opacity: 1; }
.grafico .gt { fill: var(--muted); font: 11px var(--sans); }
.grafico .gz { font: 600 10.5px var(--mono); }
.grafico .gax { fill: var(--fg); font-size: 12px; }
.grafico .gtray { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 3 3; }
.grafico .gp { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.grafico .gpa { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding-left: 0 !important; }
.sw { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: middle; }
.sw.gok { background: var(--ok-bg); border: 1px solid var(--ok); } .sw.gwarn { background: var(--warn-bg); border: 1px solid var(--warn); } .sw.gbad { background: var(--bad-bg); border: 1px solid var(--bad); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); vertical-align: middle; }
.dot.a { background: var(--surface); border: 2px solid var(--accent); }

/* esenciales / opcionales */
.flash-nota { margin: -4px 0 12px; padding: 8px 12px; border-radius: var(--r); background: var(--accent-soft); font-size: 13.5px; }
.modo-seg label { padding: 4px 12px; font-size: 13px; }
.nuevo-grupo { display: inline-flex; gap: 8px; flex-wrap: wrap; }
details.mas { margin: -4px 16px 14px; border: 1px dashed var(--line-strong); border-radius: var(--r); }
section.sec > h3 + details.mas, section.sec > .sec-nota + details.mas { margin-top: 12px; }
details.mas > summary { cursor: pointer; padding: 8px 12px; font-size: 13.5px; color: var(--accent); list-style: none; }
details.mas > summary::-webkit-details-marker { display: none; }
details.mas > summary::before { content: "＋ "; }
details.mas[open] > summary::before { content: "－ "; }
details.mas .mas-n { color: var(--muted); }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.pager .btn { max-width: 100%; white-space: normal; text-align: left; }
.pager .sec-nota { padding: 0; margin: 0; }
/* novedades y aviso de actualización */
.novedades-btn { margin-left: 12px; font-size: 13px; }
.actualizar { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 8px 16px; background: #fff4dd; border-bottom: 1px solid #e8c77a; font-size: 14px; }
.actualizar[hidden] { display: none; }
.modal-fondo { position: fixed; inset: 0; background: rgba(20, 30, 32, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal-fondo .modal { background: #fff; color: #1a1a1a; max-width: 620px; width: 100%; max-height: 85vh; overflow: auto; border-radius: 10px; padding: 22px 24px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.modal-fondo h2 { font-size: 19px; margin: 0 0 10px; }
.modal-fondo ul { padding-left: 20px; margin: 0 0 12px; line-height: 1.5; } .modal-fondo li { margin: 5px 0; }
.modal-fondo .acciones { display: flex; justify-content: flex-end; }
table.fam input[type=text] { min-width: 220px; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; }
@media print { .actualizar, .modal-fondo, .novedades-btn { display: none !important; } }
/* etapa 8: R24 detallado y TFC */
table.r24d td select { max-width: 150px; }
table.r24d td input[type=text]:not(.hora) { min-width: 110px; }
table.tfc td select { min-width: 90px; }
/* etapa 7: gestante */
ol.pasos { list-style: none; margin: 8px 16px 10px; padding: 0; border: 1px solid var(--line); border-radius: var(--r); }
ol.pasos li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 7px 12px; border-bottom: 1px solid var(--line); }
ol.pasos li:last-child { border-bottom: none; background: #eef4f4; font-weight: 600; }
ol.pasos .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.aviso-g { margin: 6px 16px 10px; padding: 8px 12px; border-left: 3px solid #c77700; background: #fff6e6; font-size: 13.5px; }
table.res tr.sel td { background: #e8f1f1; font-weight: 600; }
/* etapa 6: cierre */
p.dni-txt { font-size: 15px; }
b.dni-panel { font-weight: 400; font-size: 12.5px; line-height: 1.4; display: block; }
ul.obj-est, ul.obj-sug, ul.deriv { margin: 0; padding: 0 0 0 18px; }
ul.obj-sug { list-style: none; padding: 0; }
ul.obj-sug li { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
ul.obj-sug li span { flex: 1; }
ul.deriv { padding: 10px 16px 10px 34px; } ul.deriv li { margin: 3px 0; }
.bloom { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 12px 16px; }
.bloom div { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-size: 12.5px; }
.bloom b { display: block; color: var(--accent); margin-bottom: 4px; }
.hoja { margin: 12px 16px 16px; padding: 18px 20px; border: 1px solid var(--line); background: #fff; color: #1a1a1a; font-size: 12px; }
.hoja h2 { font-size: 16px; margin: 0 0 2px; }
.hoja-aviso { font-size: 10.5px; color: #555; margin: 0 0 8px; }
table.hr { width: 100%; border-collapse: collapse; }
table.hr th, table.hr td { border: 1px solid #cfd6d6; padding: 3px 6px; text-align: left; vertical-align: top; font-size: 11.5px; }
table.hr th { background: #f2f5f5; font-weight: 600; width: 17%; }
table.hr tr.sec td { background: #e3ecec; font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: .04em; }
table.hr td.txt { line-height: 1.4; } table.hr ol { margin: 0; padding-left: 18px; }
.hoja .firma { margin-top: 18px; font-size: 11.5px; }
#printHost { display: none; }
@media print {
  @page { size: letter; margin: 11mm; }
  body.imprimiendo > *:not(#printHost) { display: none !important; }
  body.imprimiendo { background: #fff; }
  body.imprimiendo #printHost { display: block; }
  #printHost .hoja { margin: 0; border: none; padding: 0; font-size: 10.5px; }
  #printHost table.hr th, #printHost table.hr td { font-size: 9.6px; padding: 2px 5px; }
  #printHost .firma { margin-top: 10px; }
  #printHost .hoja + .hoja { break-before: page; page-break-before: always; }
  #printHost .hoja-pauta table.hr th, #printHost .hoja-pauta table.hr td { font-size: 9.6px; padding: 2.5px 5px; }
  #printHost .hoja-pauta .pauta-pd, #printHost .hoja-pauta .sec-nota { font-size: 9.6px; margin-top: 6px; }
  #printHost .autoria { font-size: 7.5px; margin-top: 8px; }
}
/* etapa 5: laboratorio */

// ---------- almacenamiento ----------
const Store = { modo: "local", db: null, uid: null, dl: null };
const LKEY = "atencion_nutricional_aps_v1";
async function conTiempo(p, ms) { return Promise.race([p, new Promise((r) => setTimeout(() => r(null), ms))]); }
async function iniciarStore() {
  try {
    if (window.claude && window.claude.use) {
      const [db, user, dl] = await Promise.all([conTiempo(claude.use("db"), 10000), conTiempo(claude.use("user"), 10000), conTiempo(claude.use("downloads"), 10000)]);
      Store.dl = dl;
      const uid = user ? await conTiempo(user.id(), 10000) : null;
      if (db && uid) { Store.db = db; Store.uid = uid; Store.modo = "nube"; }
    }
  } catch (e) { /* queda en modo local */ }
}
function leerLocal() { try { return JSON.parse(localStorage.getItem(LKEY) || "{}"); } catch (e) { return {}; } }
function escribirLocal(m) { try { localStorage.setItem(LKEY, JSON.stringify(m)); return true; } catch (e) { return false; } }
async function listarPacientes() {
  if (Store.modo === "nube") {
    const snap = await conTiempo(Store.db.collection("data/users/" + Store.uid).get(), 10000);
    if (!snap) throw new Error("tiempo");
    return snap.docs.map((d) => d.data()).filter(Boolean);
  }
  return Object.values(leerLocal());
}
async function guardarPaciente(p) {
  p.actualizado = new Date().toISOString();
  if (Store.modo === "nube") { await Store.db.collection("data/users/" + Store.uid).doc(p.id).set(JSON.parse(JSON.stringify(p))); return; }
  const m = leerLocal(); m[p.id] = p; if (!escribirLocal(m)) throw new Error("local");
}
async function borrarPaciente(id) {
  if (Store.modo === "nube") { await Store.db.collection("data/users/" + Store.uid).doc(id).delete(); return; }
  const m = leerLocal(); delete m[id]; escribirLocal(m);
}

function migrar(p) {
  if (p.tipo === "gestante") { for (const c of p.controles) { c.datos.sexo = "Femenino"; c.datos.so_emb = "Sí"; } }
  delete p.tipo;
  for (const c of p.controles) {

    if (!vacio(d.farmacos) && d.px_farm_si === undefined) { d.px_farm_si = "Sí"; d.px_farm_lista = [{ nombre: String(d.farmacos), dosis: "", funcion: "", fm: false }]; delete d.farmacos; }

  }
}

// ---------- exportar / importar (Excel; los JSON antiguos se siguen pudiendo importar) ----------
const nombreArchivo = (t) => String(t || "paciente").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 60) || "paciente";
function navTitulos() { const o = {}; for (const lista of Object.values(MODS)) for (const m of lista) if (m.id && !o[m.id]) o[m.id] = m.t; return o; }
async function descargar(nombre, buf) {
  if (Store.dl) {
    try { await Store.dl.save({ filename: nombre, data: buf.slice(0) }); toast("Archivo guardado"); return; }
    catch (e) { if (e && e.code === "declined") return; }
  }
  const url = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  const a = document.createElement("a"); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Descargado: " + nombre);
}
async function exportar(todos) {
  try {
    if (st.p) await ejecutarGuardado();
    const lista = todos ? st.pacientes : [st.p];
    if (!lista.length) { toast("No hay pacientes para respaldar"); return; }
    toast("Preparando Excel…");
    const buf = await ExcelPac.exportar(lista, { ESQ, NAVT: navTitulos(), Calc, CAMPOS, TAB, version: APP_VERSION });
    const f = new Date().toISOString().slice(0, 10);
    await descargar(todos ? `respaldo_pacientes_${f}.xlsx` : `${nombreArchivo(st.p.nombre)}_${f}.xlsx`, buf);
  } catch (e) { toast("No se pudo crear el Excel. Revise su conexión e intente de nuevo."); }
}
function importar(file) {
  if (!file) return;
  const fr = new FileReader(), esJSON = /\.json$/i.test(file.name);
  fr.onload = async () => {
    try {
      let lista;
      if (esJSON) {
        const o = JSON.parse(fr.result), p = o && o.formato === "atencion-nutricional-aps" ? o.paciente : null;
        if (!p || !Array.isArray(p.controles) || !p.controles.length) throw new Error("formato");
        lista = [p];
      } else lista = await ExcelPac.importar(fr.result, { CAMPOS });
      let n = 0;
      for (const p of lista) {
        if (!/^[A-Za-z0-9_-]{1,80}$/.test(p.id || "") || st.pacientes.some((x) => x.id === p.id)) p.id = nuevoId();
        migrar(p); sincronizarMeta(p); st.pacientes.push(p); st.p = p; await ejecutarGuardado(); n++;
      }
      st.p = null; toast(n === 1 ? "Paciente importado" : n + " pacientes importados"); vistaInicio();
    } catch (e) { st.p = null; toast("El archivo no es un paciente exportado desde esta app."); }
  };
  if (esJSON) fr.readAsText(file); else fr.readAsArrayBuffer(file);
}

    html += `<h2 style="font-size:17px;margin:22px 0 10px">Decisiones docentes 07-11-2026 · ${okd} de ${C.length}</h2><div class="pr-caso caja" style="padding:14px"><div class="tabla-w"><table class="pr"><thead><tr><th>Comprobación</th><th>Esperado</th><th>App</th><th></th></tr></thead><tbody>${fd}</tbody></table></div></div>`;
  }
  html += `<h2 style="font-size:17px;margin:22px 0 10px">Etapa 7 · gestante y nodriza · ${okG} de ${totG} comprobaciones</h2><p class="sec-nota" style="padding:0 0 10px">Sin planilla de referencia: los valores esperados se calcularon a mano con las reglas docentes (Guía Perinatal 2015, método de kcal extra, peso ideal IMC 21,7, nodriza + 500 kcal). También se revisa que cada dato se pregunte en modo flash.</p>` + hg;
  $app.innerHTML = `<div class="inicio-h"><div><h1>Pruebas · etapas 1 a 8</h1><p>Referencia: Planilla_Nutricional.xlsx y Planilla_NNA.xlsx recalculadas en LibreOffice (3 casos de la planilla, 7 casos de consulta flash y 17 escenarios), y REPORTE_PRUEBAS.md (Excel).</p></div>
    <button class="btn" data-a="volver">← Pacientes</button></div>
    <div class="resumen-pr"><span class="estado ${okT === tot ? "normal" : "alterado"}">${okT} de ${tot} comparaciones coinciden</span></div>${html}`;
}

// ---------- arranque ----------
await iniciarStore();
try { st.pacientes = await listarPacientes(); st.pacientes.forEach(migrar); }
catch (e) { st.pacientes = []; $estado.textContent = "No se pudo leer la lista de pacientes. Recargue la página."; }
document.getElementById("pieAutor").textContent = AUTORIA;
if (location.hash === "#ficha") history.replaceState(null, "", "#inicio");
ruta();
if (location.hash !== "#pruebas") mostrarNovedades(false);
setInterval(revisarActualizacion, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) revisarActualizacion(); });
revisarActualizacion();
})();
</script>
